name: Bug Report
description: Report something that is not working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
        **Security vulnerabilities must not be reported here** — see [SECURITY.md](https://github.com/VidIsWandering/secure-payment-gateway/blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Endpoint, headers and body (redact keys and secrets).
      placeholder: |
        1. POST /api/v1/payments with body '...'
        2. ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the HTTP status code and `error_code` from the response.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v0.2.0 or commit SHA
  - type: dropdown
    id: runtime
    attributes:
      label: How are you running the gateway?
      options:
        - docker compose
        - go run / make run
        - Other
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS: Ubuntu 24.04
        Go: 1.26.x
        Docker: 27.x
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output (include `request_id` if available).
      render: shell
