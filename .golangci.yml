version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  # "standard" set: errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - gosec
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    gosec:
      excludes:
        - G104 # Unhandled errors (too noisy for fire-and-forget patterns)
        - G114 # net/http serve without timeout (handled by gin)
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Test fixtures intentionally contain fake credentials.
      - path: _test\.go
        linters:
          - gosec
    paths:
      - vendor
      - internal/core/ports/mocks

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
