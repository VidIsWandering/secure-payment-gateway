services:
  # ---- PostgreSQL ----
  postgres:
    image: postgres:16-alpine
    container_name: spg-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payment_gateway
    ports:
      - "5435:5435"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/migrations/001_init_schema.up.sql:/docker-entrypoint-initdb.d/001_init_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - spg-network

  # ---- Redis ----
  redis:
    image: redis:7-alpine
    container_name: spg-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - spg-network

  # ---- Application ----
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spg-app
    ports:
      - "8080:8080"
    volumes:
      - ./web:/app/web
    environment:
      SPG_SERVER_MODE: debug
      SPG_DATABASE_HOST: postgres
      SPG_DATABASE_PORT: "5432"
      SPG_DATABASE_USER: postgres
      SPG_DATABASE_PASSWORD: postgres
      SPG_DATABASE_DBNAME: payment_gateway
      SPG_DATABASE_SSLMODE: disable
      SPG_REDIS_HOST: redis
      SPG_REDIS_PORT: "6379"
      SPG_JWT_SECRET: "${JWT_SECRET:-change-me-use-strong-secret-in-production-32}"
      SPG_AES_KEY: "${AES_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}"
      SPG_LOG_LEVEL: info
      SPG_LOG_PRETTY: "false"
      # Rate limit override for payment endpoint (default: 100/min).
      # Set higher for load testing; comment out or set to 0 for production defaults.
      SPG_RATELIMIT_PAYMENTS: "${SPG_RATELIMIT_PAYMENTS:-0}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - spg-network
    restart: unless-stopped

  # ---- Prometheus (Monitoring) ----
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: spg-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    depends_on:
      - app
    networks:
      - spg-network

  # ---- Grafana (Dashboard) ----
  grafana:
    image: grafana/grafana:11.1.0
    container_name: spg-grafana
    ports:
      - "3005:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/payment-gateway.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - spg-network

volumes:
  pg_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  spg-network:
    driver: bridge
