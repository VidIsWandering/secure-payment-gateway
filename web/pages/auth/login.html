<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Secure Payment Gateway</title>
  <link rel="stylesheet" href="/css/global.css">
  <style>
    .auth-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: calc(100vh - 80px);
    }
    
    .auth-card {
      width: 100%;
      max-width: 400px;
      padding: 3rem 2.5rem;
    }

    .auth-title {
      text-align: center;
      margin-bottom: 0.5rem;
      font-size: 1.8rem;
    }

    .auth-subtitle {
      text-align: center;
      color: var(--text-muted);
      margin-bottom: 2.5rem;
    }

    .btn-submit {
      width: 100%;
      padding: 0.8rem;
      font-size: 1rem;
      margin-top: 1rem;
    }

    .auth-footer {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header class="navbar container">
    <a href="/" class="navbar-brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
      </svg>
      SecurePay
    </a>
    <a href="/register" class="nav-link">Create Account</a>
  </header>

  <main class="main-content container auth-wrapper">
    <div class="glass-panel auth-card fade-in">
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Sign in to your Merchant Dashboard.</p>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input type="text" id="username" class="form-control" required>
        </div>
        
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-primary btn-submit" id="btn-login">Sign In to Dashboard</button>
      </form>

      <div class="auth-footer">
        New around here? <a href="/register">Register a Merchant account</a>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    if (spgAPI.getToken()) {
      window.location.href = '/dashboard';
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-login');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Authenticating...';

      try {
        const payload = {
          username: document.getElementById('username').value,
          password: document.getElementById('password').value,
        };

        const response = await spgAPI.call('/auth/login', {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        // Save JWT Session
        spgAPI.setToken(response.token, payload.username);
        
        // Redirect to dashboard
        window.location.href = '/dashboard';
        
      } catch (err) {
        spgAPI.showToast(err.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Sign In to Dashboard';
      }
    });
  </script>
</body>
</html>
